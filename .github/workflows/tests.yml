# TOUS LES TESTS, LANCES AILLEURS QUE SUR LE POSTE QUI DEPOSE.
#
# La suite du moteur : `cargo nextest run` dans l'espace `atelier/sources/` : les crates du logiciel, du socle au moteur
# (`default-members`) ; puis la suite de la crate `atelier`, dans sa cible. Elle tourne sur des compagnies
# de test que les tests montent eux-memes, jamais sur `prive/`.
#
# ROUGE = ON NE FUSIONNE PAS.

name: Tests

# A LA MAIN SEULEMENT. La suite passe dans le conteneur avant chaque PR ; ici,
# elle ne tourne que lancee a la main (onglet Actions). Le depot est public :
# les minutes sont illimitees, ce n'est pas une question de quota (15/10/2026).
on:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  moteur:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atelier/sources
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # Les deux cibles : celle de la suite livree et celle de la suite de l'atelier (sinon elle se recompile a froid).
          workspaces: |
            atelier/sources
            atelier/sources -> target-atelier
      # nextest en binaire precompile : rien a compiler, aucune minute de plus.
      - uses: taiki-e/install-action@nextest
      - name: Lancer la suite du moteur
        run: cargo nextest run --cargo-profile essais --locked --no-fail-fast
      # La crate `atelier`, hors de `default-members`, dans sa propre cible : elle allume la feature `atelier` de ce
      # qu'elle prend, qui se recompile donc a part (atelier/AGENTS.md, « Les tests »).
      - name: Lancer la suite de l'atelier
        run: cargo nextest run --cargo-profile essais --locked -p atelier --target-dir target-atelier

  # LA CIBLE WINDOWS, celle que les compagnies recoivent : le moteur et la fenetre se compilent pour elle, comme
  # l'installeur les construit (`atelier/installeur/construire.sh`), mais en verifiant seulement les types. Sans ce
  # passage, une cible Windows cassee ne se voit qu'a la publication (du 11 au 17/11/2026, elle ne compilait plus).
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
          workspaces: |
            atelier/sources
            atelier/sources/fenetre
      - name: MinGW et la cible Windows
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - name: Le moteur pour Windows
        run: cargo check --locked --target x86_64-pc-windows-gnu --manifest-path atelier/sources/moteur/Cargo.toml
      - name: La fenetre pour Windows
        run: cargo check --locked --target x86_64-pc-windows-gnu --manifest-path atelier/sources/fenetre/Cargo.toml

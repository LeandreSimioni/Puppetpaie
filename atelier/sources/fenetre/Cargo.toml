[package]
name = "puppetpaie"
version = "0.1.0"
edition = "2021"
description = "La fenetre de PuppetPaie (lot J3) : le moteur `moteur` et sa page, dans une fenetre Tauri."
license = "EUPL-1.2"
publish = false

[[bin]]
name = "puppetpaie"
path = "src/main.rs"
# Le binaire n'a pas d'essais (le harnais de test leverait le `forbid(dead_code)` sur son `main`).
test = false

# Les niveaux de l'espace (`atelier/sources/Cargo.toml`, `[workspace.lints.rust]`), que la fenetre, hors de l'espace,
# porte elle-meme.
[lints.rust]
warnings = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
dead_code = "forbid"
deprecated = "forbid"
unused_imports = "forbid"
unused_variables = "forbid"
unused_assignments = "forbid"
unused_mut = "forbid"
unused_must_use = "forbid"
unused_macros = "forbid"
unused_unsafe = "forbid"
unused_parens = "forbid"
unused_braces = "forbid"
unused_labels = "forbid"
unused_doc_comments = "forbid"
unused_allocation = "forbid"
path_statements = "forbid"
unreachable_code = "forbid"
unreachable_patterns = "forbid"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Le moteur : le serveur de la fenetre (`moteur::interface`).
moteur = { path = "../moteur" }
# Les routes, que ce binaire sert aussi (`puppetpaie route`, `puppetpaie routes`).
routes = { path = "../routes" }
# La compagnie : l'installation, l'instance unique sur le poste, la mise a jour au lancement.
compagnie = { path = "../compagnie" }
fabrique-pdf = { path = "../fabrique-pdf" }
# Les arguments du processus, que seul `socle::ligne` lit.
socle = { path = "../socle" }
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
# « unwind », pas « abort » (ticket #244) : la fenetre sert les routes du moteur dans son processus ; une route qui
# tombe (une panique) doit rendre un refus `DefautDuLogiciel` et laisser la fenetre debout (`routes::dans_la_fenetre`,
# `catch_unwind`). En « abort », la premiere panique fermait le logiciel.
panic = "unwind"
strip = true

[profile.release.package.scrypt]
opt-level = 3
[profile.release.package.salsa20]
opt-level = 3
[profile.release.package.pbkdf2]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3

# L'espace Cargo du moteur : une crate par partie, chaque flèche descend.
#
#     atelier       tout ce qui n'est pas le logiciel, dans le binaire du nuage `moteur-atelier`, jamais livre : les
#                   releves des textes, les referentiels, les tables Unicode, le garde avant commit, le guet, les
#                   bulletins fictifs, les outils sur une compagnie, les scenarios du banc ; rien ne le prend
#     moteur        la ligne de commande `moteur`, l'interface (le serveur de la fenetre, la page d'accueil, la veille
#                   qui tourne) et la publication par GitHub (ce que le flux « Publier » appelle)
#     routes        la porte du moteur (l'enveloppe, le catalogue) et chaque route ; ce qu'elles font : la compagnie
#                   qu'une route sert, l'etat garde d'un mois, les gestes de la compagnie qui appellent des routes, ce
#                   que l'import compose et ecrit pour elles (`importation`), les obligations, les regularisations,
#                   l'Historique d'un mois ; et ce qu'une installation fait d'une fictive (le scenario, l'horloge, les
#                   courriels joues)
#     import        le passe d'une compagnie tenu dans un autre logiciel, tel que ses pieces le disent (DSN et AEM
#                   deposees, bulletins, certificats Congés Spectacles, AEM en PDF), leur tri, les fiches qu'elles
#                   proposent, les mois importes, les ecarts de calcul, le caviardage ; ce que l'import compose et
#                   ecrit pour une route est dans les routes (`importation`)
#     compagnie     ce qui garde et fait vivre la compagnie a cote de ses engagements : l'installation qui la porte sur
#                   le poste, le coffre et ses mots de passe, la preuve d'un acte reel, la sauvegarde et la restauration,
#                   la mise a jour, le bridage, les incidents et le filet ; choisit le branchement des envois, ouvre le
#                   coffre, note les incidents
#     envois        ce qui part et revient (net-entreprises, DPAE, signature, courriel, Drive, retours et bilans) et le
#                   journal de ce qui est parti ; recoit des pieces fabriquees et un mot de passe, ne fabrique rien,
#                   n'ouvre jamais le coffre
#     declarations  ce qu'un engagement validé fait déclarer (DSN mensuelle et signalements, DPAE, régularisations,
#                   bloc 44, CSA, OETH, CASC-SVP, et la norme qui les contrôle : usages, formats, natures, champs) ;
#                   les états de ce qu'une DSN a porté ; ne recalcule rien
#     documents     ce qu'un engagement validé fait imprimer, signer ou envoyer (contrat, avenant, bulletin, certificat
#                   Congés Spectacles, AER, questionnaire, récapitulatif annuel, bordereau, prélèvement, états de paie,
#                   du personnel et de comptabilité, plan comptable, numéros des pièces, fabrique de PDF) ; ne
#                   recalcule rien
#     engagement    la saisie, le calcul de ses paies, la validation, le recalcul ; lit ce qui est parti ; ne fabrique
#                   aucun document
#     droit         barèmes datés, conventions, natures de contrat, règles ; lit tout à une date ; ne connaît pas
#                   l'engagement
#     socle         dates, heure de Paris, temps simulé, nombres, texte, HTML et base64, fichiers, échecs, garde-fou
#                   réseau
#
# `declarations` prend à `documents` (le bordereau, le bulletin, le certificat que la DSN reprend), jamais l'inverse.
# `envois` prend à `declarations` et à `documents` ce qui part ; l'engagement ne lit pas le journal, les routes lui
# passent ce qui est parti.
#
# La fenêtre (`fenetre/`) et la fabrique de PDF (`fabrique-pdf/`) gardent chacune leur verrou et leurs profils : elles ne
# sont pas de l'espace (la fenêtre prend `moteur` et `routes` par leur chemin).

#
# L'ATELIER EST HORS DE `default-members` : Cargo unifie les features de ce qu'il construit ensemble, et l'atelier
# allume la feature `atelier` (la redirection vers de faux serveurs) de ce qu'il prend. La suite de l'espace
# (`cargo nextest run --cargo-profile essais`) ne la voit donc jamais ; l'atelier a sa cible (`-p atelier`, gardé par
# `tests/fichiers/structure.rs`).

[workspace]
members = ["socle", "droit", "engagement", "documents", "declarations", "envois", "compagnie", "import", "routes", "moteur", "atelier"]
default-members = ["socle", "droit", "engagement", "documents", "declarations", "envois", "compagnie", "import", "routes", "moteur"]
exclude = ["fenetre", "fabrique-pdf"]
resolver = "2"

[workspace.dependencies]
# Arithmetique decimale : ROUND_HALF_UP = MidpointAwayFromZero. `serde` : un montant d'un fichier se lit en decimal,
# exactement, dans le texte que le lecteur JSON garde (`serde-with-arbitrary-precision`).
rust_decimal = { version = "1", default-features = false, features = ["std", "maths", "serde", "serde-with-arbitrary-precision"] }
# Chaque forme lue est une structure derivee (`socle::forme::lire`), qui refuse une cle inconnue.
serde = { version = "1", features = ["derive"] }
# Le chemin de la cle fautive dans le refus d'une lecture (`socle::forme`).
serde_path_to_error = "0.1"
# Ce qu'un refus porte a part dans la forme de la couche qui refuse, gardee typee jusqu'a la porte (`socle::echec::APart`).
erased-serde = "0.4"
# L'ordre des fiches d'un fichier (`droit::fiche::Salaries`) : celui du fichier, comme `serde_json` le garde.
indexmap = "2"
# `arbitrary_precision` : un nombre lu garde son texte, exact ; il ne passe jamais par un flottant (`socle::forme`).
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = { version = "0.10", default-features = false }
getrandom = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
roxmltree = { version = "0.20", default-features = false, features = ["std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
# « unwind », pas « abort » (ticket #244) : la fenetre sert les routes du moteur dans son processus ; une route qui
# tombe (une panique) doit rendre un refus `DefautDuLogiciel` et laisser la fenetre debout (`routes::dans_la_fenetre`,
# `catch_unwind`).
panic = "unwind"
strip = true

# scrypt brasse 32 Mo par essai : le code des briques de chiffrement va vite,
# le reste du binaire reste petit.
[profile.release.package.scrypt]
opt-level = 3
[profile.release.package.salsa20]
opt-level = 3
[profile.release.package.pbkdf2]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3

# Les tests (profil dev) derivent des cles scrypt par dizaines (le mot de passe du logiciel, les demandes de `demande.rs`) :
# ces briques-la, optimisees, les font passer de minutes a secondes.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# Le profil des ESSAIS (`cargo nextest run --cargo-profile essais`) : le code optimise de `release`, sans le LTO ni
# l'unite de compilation unique, qui se repaient pour chacun des binaires de `tests/`. L'exe livre (`release`) ne change pas.
[profile.essais]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = false
panic = "unwind"
[profile.essais.package."*"]
opt-level = 2
[profile.essais.package.scrypt]
opt-level = 3
[profile.essais.package.salsa20]
opt-level = 3
[profile.essais.package.pbkdf2]
opt-level = 3
[profile.essais.package.sha2]
opt-level = 3

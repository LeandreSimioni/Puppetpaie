[lints]
workspace = true

[package]
name = "moteur"
version = "0.1.0"
edition = "2021"
description = "Le moteur de PuppetPaie au-dessus des routes : la ligne de commande `moteur`, l'interface, la publication par GitHub."
license = "EUPL-1.2"
publish = false

[lib]
path = "src/lib.rs"

# Le binaire n'a pas d'essais : ils sont dans la bibliotheque et `tests/` (le harnais de test d'un binaire leverait le
# `forbid(dead_code)` de l'espace sur son `main`).
[[bin]]
name = "moteur"
path = "src/main.rs"
test = false

[features]
# Le binaire de l'ATELIER (`moteur-atelier`, la crate `atelier`, jamais livre) : le banc de la fenetre, et les
# garde-fous des commandes qu'il redirige vers de faux serveurs locaux.
atelier = ["routes/atelier"]

[dependencies]
# Les deux parties du dessous : le socle (dates, nombres, fichiers, echecs, temps, garde-fou reseau) et le droit
# (baremes dates, conventions, natures de contrat, regles).
socle = { path = "../socle" }
droit = { path = "../droit" }
engagement = { path = "../engagement" }
serde = { workspace = true }
# L'empreinte d'un fichier (deja liee par la fabrique de PDF).
sha2 = { workspace = true }
# Le bulletin : la description part a la fabrique dans le meme processus.
fabrique-pdf = { path = "../fabrique-pdf" }
# Ce qui part et revient, et le journal de ce qui est parti.
envois = { path = "../envois" }
# Les documents que fabrique un engagement valide.
documents = { path = "../documents" }
# Les aleas du systeme : le jeton de la fenetre (`interface`), la graine de la cle de GitHub (`publication`).
getrandom = { workspace = true }
# Ce qui garde et fait vivre la compagnie : l'installation, le coffre, la preuve d'un acte reel, la mise a jour.
compagnie = { path = "../compagnie" }
# Les routes : la porte du moteur, et ce qu'elles font.
routes = { path = "../routes" }
# Les courriels joués de la démonstration, que la fenetre montre (`interface`) : lecture MIME, bibliothèque éprouvée.
mailparse = "0.16"
# La publication par GitHub (`publication`) : la signature Ed25519 de l'editeur, et l'archive zip.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
zip = { workspace = true }

[dev-dependencies]
# Les essais lisent la reponse d'une route telle que la page la recoit : du JSON.
serde_json = { workspace = true }
# Le faux Drive des essais (`tests/faux_drive`) publie l'empreinte MD5 de chaque fichier, comme Drive.
md-5 = { version = "0.10", default-features = false }
# Les montants qu'un essai compare.
rust_decimal = { workspace = true }
# Les gardes de structure (`tests/fichiers/structure.rs`, `sources.rs`) cherchent des motifs dans les sources.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
# Le verrou des sources (`tests/fichiers/sources.rs`) lit les livraisons gzip de LEGI.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Les essais des declarations et de l'import passent par les routes et lisent ce qu'elles ecrivent.
declarations = { path = "../declarations" }
import = { path = "../import" }
